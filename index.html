<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Absensi Adita Praja</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="glass-card">
            <img src="logo.png" alt="Logo" class="logo-login" style="width: 80px; margin-bottom: 10px;">
            <h2>Dewan Ambalan<br>Adita Praja</h2>
            <p class="login-subtitle" style="margin-bottom: 20px;">Sistem Absensi Terintegrasi</p>
            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label style="text-align: left; display: block; color: white;">Username</label>
                    <input type="text" id="input-username" required>
                </div>
                <div class="form-group">
                    <label style="text-align: left; display: block; color: white;">Password</label>
                    <input type="password" id="input-password" required>
                </div>
                <button type="submit" class="btn-primary btn-login">MASUK</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
