<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="halaman-admin">
    <nav>
        <div class="nav-brand"><img src="logo.png" class="nav-logo"> Admin Adita Praja</div>
        <div class="nav-menu"><span id="user-info">Memuat...</span><button class="btn-logout" onclick="logout()">Keluar</button></div>
    </nav>
    <div class="container admin-grid">
        <div class="card config-card">
            <div class="card-header"><h4>⚙️ Pengaturan Sanggar & Jam</h4></div>
            <div class="card-body">
                <form onsubmit="simpanPengaturanRadiusCloud(event)">
                    <div class="form-group"><label>Latitude & Longitude</label>
                        <div style="display:flex; gap:10px;"><input type="text" id="cfg-lat" required><input type="text" id="cfg-lng" required></div>
                    </div>
                    <div class="form-group"><label>Maks Radius (Meter)</label><input type="number" id="cfg-radius" required></div>
                    <div class="form-group"><label>Jam Buka & Tutup Absen</label>
                        <div style="display:flex; gap:10px;"><input type="time" id="cfg-jam-mulai" required><input type="time" id="cfg-jam-selesai" required></div>
                    </div>
                    <button type="submit" class="btn-primary mt-1 w-100">Simpan Pengaturan</button>
                </form>
            </div>
        </div>
        <div class="card data-card">
            <div class="card-header flex-between">
                <h4>📋 Rekap Kehadiran</h4>
                <div style="display:flex; gap:10px;">
                    <input type="date" id="filter-tanggal" onchange="muatDataAbsensiHarianCloud()">
                    <button class="btn-primary" onclick="exportExcel()">📥 EXCEL</button>
                </div>
            </div>
            <div class="card-body" style="overflow-x: auto;">
                <table class="table" id="tabel-rekap">
                    <thead><tr><th>Jam</th><th>Nama Lengkap</th><th>Jarak</th><th>Status</th><th>Foto</th></tr></thead>
                    <tbody id="isi-rekap-absen"><tr><td colspan="5" class="text-center">Pilih tanggal.</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
